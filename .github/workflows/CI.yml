name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

permissions:
  contents: read

# Make sure CI fails on all warnings, including Clippy lints
env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  security-audit:
    # Blacksmith: no-artifact job, safe to run on managed runners (see PR).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Rust
        run: rustup show

      - name: Install cargo-audit
        # --locked pins cargo-audit's own resolved dependencies so a
        # transitive MSRV bump (e.g. kstring 2.0.3 requiring rustc 1.96) can't
        # break the install on the CI toolchain.
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # RUSTSEC-2026-0176 / -0177 are pyo3 < 0.29 advisories (fixed in pyo3 >= 0.29).
        # pyo3 is pinned to 0.27 by pyo3-polars 0.26 (the PyO3<->Polars bridge);
        # even the latest pyo3-polars (0.27) only reaches pyo3 0.28, which is still
        # affected, and no pyo3-polars release supports pyo3 0.29 yet. Full
        # rationale + tracking in .cargo/audit.toml. Revisit when pyo3-polars
        # supports pyo3 >= 0.29.
        run: cargo audit --ignore RUSTSEC-2026-0176 --ignore RUSTSEC-2026-0177

      - name: Check for Python dependency vulnerabilities
        run: |
          python -m pip install --upgrade pip
          pip install safety
          pip install -r requirements.txt
          # Run safety check (allow to fail for now, but show results)
          safety check || true

  coverage:
    # Blacksmith: no-artifact job, safe to run on managed runners (see PR).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Rust
        run: rustup show

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install virtualenv
          python -m virtualenv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-cov python-dotenv

      - name: Build package
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Run Rust coverage
        run: |
          # Run cargo-tarpaulin for Rust code coverage
          cargo tarpaulin --out Xml --output-dir ./coverage --skip-clean --exclude-files 'tests/*' || true

      - name: Run Python coverage
        run: |
          source .venv/bin/activate
          # Run pytest with coverage (exclude Apple-GPU-only tests; local logic tests still run)
          pytest tests --cov=polar_llama --cov-report=xml:coverage/python-coverage.xml --cov-report=term -m "not local_gpu" --ignore=tests/test_parallel_inference.py || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/cobertura.xml,./coverage/python-coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage/

  linux_tests:
    # Blacksmith: no-artifact job, safe to run on managed runners (see PR).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        target: [x86_64]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.10
      
      # Install dependencies and create virtualenv
      - name: Install dependencies and create virtualenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install virtualenv
          python -m virtualenv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest python-dotenv
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
      
      # Build and install the package with maturin
      - name: Build and install package
        run: |
          source .venv/bin/activate
          maturin develop --release
      
      # Debug: Check the installed package structure
      - name: Debug Package Installation
        run: |
          source .venv/bin/activate
          echo "=== Package installation check ==="
          pip show polar-llama
          echo ""
          echo "=== Python site-packages contents ==="
          python -c "
          import site
          import os
          for path in site.getsitepackages():
              polar_path = os.path.join(path, 'polar_llama')
              if os.path.exists(polar_path):
                  print(f'Found polar_llama at: {polar_path}')
                  for item in os.listdir(polar_path):
                      print(f'  - {item}')
          "
          echo ""
          echo "=== Test basic import ==="
          python -c "
          try:
              import polar_llama
              print('✓ polar_llama imported successfully')
              print(f'polar_llama location: {polar_llama.__file__}')
              
              from polar_llama import Provider
              print('✓ Provider imported successfully')
              print(f'Provider.OPENAI: {Provider.OPENAI}')
              
          except Exception as e:
              print(f'✗ Import failed: {e}')
              import traceback
              traceback.print_exc()
          "
      
      # Run tests from a different directory to ensure we're testing the installed package
      - name: Run Tests
        run: |
          source .venv/bin/activate
          # Don't set API keys - let tests skip gracefully when not configured

          # Create a temporary directory and run tests from there
          mkdir -p /tmp/test_run
          cd /tmp/test_run

          # Copy test files to temp directory
          cp -r $GITHUB_WORKSPACE/tests .

          # Run tests, excluding API integration tests (those run in test-llm-apis.yml workflow).
          # `-m "not local_gpu"` runs the CI-safe local-backend logic tests (marked `local`,
          # FakeEngine, no mlx) while deselecting Apple-GPU-only tests (marked `local_gpu`).
          python -m pytest tests -v --tb=short -m "not local_gpu" --ignore=tests/test_parallel_inference.py
      
      # Run pre-commit checks
      - name: Run pre-commit checks
        run: |
          source .venv/bin/activate
          cd $GITHUB_WORKSPACE
          cargo fmt --all && cargo clippy --all-features
          python -m ruff check . --fix || true
          if [ -d "polar_llama" ]; then
            python -m ruff format polar_llama || true
          fi
          if [ -d "tests" ]; then
            python -m ruff format tests || true
          fi
          if [ -d "polar_llama" ] && [ -d "tests" ]; then
            python -m mypy --ignore-missing-imports polar_llama tests || true
          elif [ -d "polar_llama" ]; then
            python -m mypy --ignore-missing-imports polar_llama || true
          elif [ -d "tests" ]; then
            python -m mypy --ignore-missing-imports tests || true
          fi

  llamacpp_server_test:
    # Blacksmith: no-artifact job, safe to run on managed runners (see PR).
    # Issue #84, Tier 1: exercises `engine="server"` (polar_llama/local/server_backend.py,
    # unchanged -- it already talks to any OpenAI-compatible local server) against a
    # REAL llama.cpp `llama-server` process, so the non-Apple server path documented in
    # docs/local_llamacpp_backend.md gets real coverage instead of only the mock server
    # used by tests/test_local_server_backend.py. Both the llama.cpp build and the GGUF
    # are pinned so this job's behavior doesn't drift out from under it.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # Pinned llama.cpp release (github.com/ggml-org/llama.cpp/releases). Bump
      # deliberately -- this pin is what keeps the job reproducible.
      LLAMACPP_TAG: b10004
      LLAMACPP_ASSET: llama-b10004-bin-ubuntu-x64.tar.gz
      # Pinned tiny instruct GGUF (~135M params, ~100MB Q4_K_M) -- small enough to
      # download and run per-CI-run with no GPU.
      GGUF_REPO: bartowski/SmolLM2-135M-Instruct-GGUF
      GGUF_FILE: SmolLM2-135M-Instruct-Q4_K_M.gguf
      # Pin to an immutable commit revision (not the `main` branch ref) and the
      # exact LFS sha256 so a truncated/altered download can never be cached
      # and poison later runs with a confusing health-check timeout.
      GGUF_REV: 09816acd5d99df7be770d85ea30822623dab342c
      GGUF_SHA256: 2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Rust
        run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.10

      # Install dependencies and create virtualenv
      - name: Install dependencies and create virtualenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install virtualenv
          python -m virtualenv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest python-dotenv
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      # Build and install the package with maturin
      - name: Build and install package
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Install llama-server runtime dependencies
        # llama-server's CPU backend links libgomp (OpenMP); not guaranteed
        # present on the base runner image.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgomp1

      - name: Download pinned llama.cpp llama-server (${{ env.LLAMACPP_TAG }})
        run: |
          curl -fL --retry 5 --retry-delay 2 --retry-connrefused \
            -o llamacpp.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMACPP_TAG}/${LLAMACPP_ASSET}"
          mkdir -p llamacpp
          tar xzf llamacpp.tar.gz -C llamacpp --strip-components=1
          test -x llamacpp/llama-server

      - name: Cache pinned GGUF model
        id: cache-gguf
        uses: actions/cache@v6
        with:
          path: models/${{ env.GGUF_FILE }}
          # Key includes the sha256 so re-pinning the model invalidates old
          # cache entries automatically.
          key: gguf-${{ env.GGUF_FILE }}-${{ env.GGUF_SHA256 }}

      - name: Download pinned GGUF model
        if: steps.cache-gguf.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          # Download to a .part file from the pinned commit revision, then
          # atomic-rename only after the sha256 verifies -- so actions/cache
          # never persists a partial/corrupt file.
          curl -fL --retry 5 --retry-delay 2 --retry-connrefused \
            -o "models/${GGUF_FILE}.part" \
            "https://huggingface.co/${GGUF_REPO}/resolve/${GGUF_REV}/${GGUF_FILE}"
          echo "${GGUF_SHA256}  models/${GGUF_FILE}.part" | sha256sum -c -
          mv "models/${GGUF_FILE}.part" "models/${GGUF_FILE}"

      - name: Verify GGUF checksum (guards a poisoned cache)
        run: |
          echo "${GGUF_SHA256}  models/${GGUF_FILE}" | sha256sum -c -

      - name: Start llama-server
        run: |
          LD_LIBRARY_PATH="$PWD/llamacpp" \
            ./llamacpp/llama-server \
              -m "models/${GGUF_FILE}" \
              --port 8080 \
              --temp 0 \
              -n 48 \
              -c 2048 \
              --parallel 4 \
              > llama-server.log 2>&1 &
          disown

      - name: Wait for llama-server /health
        run: |
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/health; then
              echo "llama-server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::llama-server did not become healthy within 90s"
          cat llama-server.log || true
          exit 1

      - name: Run llama.cpp live server test
        env:
          POLAR_LLAMA_LLAMACPP_URL: http://127.0.0.1:8080
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_llamacpp_server_live.py -v --tb=short

      - name: Show llama-server log
        if: always()
        run: cat llama-server.log || true

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libssl-dev pkg-config

      # Most basic approach for building wheels, using the stable manylinux image
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: ${{ matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  release:
    name: Release
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      
      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
          
      - name: List distribution files
        run: ls -la dist/
          
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
