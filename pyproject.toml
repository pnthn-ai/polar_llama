[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=0.20.6"]
build-backend = "maturin"

[project]
name = "polar-llama"
dynamic = ["version"]
description = "Parallel inference calls to LLM APIs using Polars dataframes with Pydantic-based structured outputs"
authors = [{name = "David Drummond", email = "daviddrummond95@gmail.com"}]
readme = "README.md"
homepage = "https://github.com/daviddrummond95/polar_llama"
repository = "https://github.com/daviddrummond95/polar_llama"
documentation = "https://github.com/daviddrummond95/polar_llama#readme"
keywords = ["llm", "polars", "parallel", "inference", "ai", "openai", "anthropic", "gemini", "groq", "bedrock", "chatgpt", "dataframe", "pydantic", "structured-outputs", "schema-validation"]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Database",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "polars>=1.0.0",
]

[project.urls]
"Bug Reports" = "https://github.com/daviddrummond95/polar_llama/issues"
"Source" = "https://github.com/daviddrummond95/polar_llama"
"Documentation" = "https://github.com/daviddrummond95/polar_llama#readme"

[project.optional-dependencies]
local = [
    "mlx>=0.31; python_version >= '3.10'",
    # mlx-lm 0.31.3 pulls its own required transformers (>=5); do NOT cap it
    # (a <5 pin makes this extra unsatisfiable). A smoke install of 0.31.3 ran
    # batch_generate successfully against transformers>=5.
    "mlx-lm>=0.31; python_version >= '3.10'",
    # Local embeddings (issue #83): mlx_embeddings.load/generate, wrapped by
    # polar_llama.local.embed.MlxEmbeddingEngine. Apple-silicon-only via its
    # own mlx dependency, same story as mlx-lm above -- never imported at
    # `import polar_llama`/`import polar_llama.local` time.
    "mlx-embeddings>=0.1.0; python_version >= '3.10'",
]
# export_review_sample(..., format="xlsx") only -- CSV export (the default)
# needs nothing extra. Not a required dep: xlsxwriter must stay out of the
# base install (issue #81).
excel = [
    "xlsxwriter>=3.0",
]

[dependency-groups]
dev = [
    "polars>=1.8.2",
    "pytest>=8.3.5",
    "python-dotenv>=1.0.1",
]

[tool.maturin]
# Ship the packaged default price table (issue #76, polar_llama/pricing.py)
# in both the sdist and the wheel -- maturin's default file discovery is
# driven by git tracking / VCS rules, which is not guaranteed to pick up a
# data directory reliably across all install paths, so it's listed explicitly.
include = [{ path = "polar_llama/data/*.json", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
markers = [
    "local_gpu: requires Apple GPU + mlx (skipped in CI)",
    "local: local backend logic tests (CI-safe)",
    "real_api: hits a real provider API with the caller's own credentials",
]
