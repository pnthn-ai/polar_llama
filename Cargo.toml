[package]
name = "polar-llama"
version = "0.9.1"
edition = "2021"

[lib]
name = "polar_llama"
crate-type = ["cdylib", "rlib"]

[features]
# `extension-module` tells pyo3 to leave the CPython symbols undefined, which
# is required for the importable wheel and is what maturin builds. It also
# makes the crate impossible to LINK into a test binary, so it is a default
# feature rather than an unconditional one: `cargo test --no-default-features`
# links against libpython instead and can actually run the `#[cfg(test)]`
# modules. Default features are unchanged, so maturin/`cargo build` behave
# exactly as before.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[build-dependencies]
pyo3-build-config = "0.27"

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py39"] }
pyo3-polars = { version = "0.26", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls with the OS certificate store, so TLS verification stays on even
# behind corporate proxies with custom CAs
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-native-roots"], default-features = false }
polars = { version = "0.53", default-features = false, features = ["dtype-struct"] }
polars-arrow = { version = "0.53", default-features = false }
polars-core = { version = "0.53", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
# Use the ring crypto provider (not aws-lc-rs) so the Windows wheel builds:
# aws-lc-sys fails to compile under MSVC ("C atomics require C11 or later").
# The SDK's `rustls` feature = tls-rustls (ring); we drop `default-https-client`
# (aws-lc). Feature unification gives aws-config the same ring client.
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "credentials-process", "sso", "behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rt-tokio"] }
# Modern ring client (hyper 1.x): avoids aws-lc-sys AND the legacy rustls 0.21 / webpki 0.101 path.
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
jsonschema = { version = "0.46", default-features = false }
# Approximate nearest neighbor search using HNSW
instant-distance = { version = "0.6", features = ["with-serde"] }
# Token counting for cost calculation (tiktoken compatible)
tiktoken-rs = "0.12"
# SHA-256 hashing for cache prefix detection
sha2 = "0.10"
# Pure-Rust, serde-only binary (de)serialization for the persistent HNSW
# index's on-disk format (issue #82). The only new dependency this feature
# adds -- instant-distance's `HnswMap`/`EmbeddingPoint` already derive
# Serialize/Deserialize via the `with-serde` feature above.
bincode = "1"

[target.'cfg(target_os = "linux")'.dependencies]
jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }

[dev-dependencies]
dotenvy = "0.15"
tokio-test = "0.4"

[profile.release]
codegen-units = 1
lto = true
